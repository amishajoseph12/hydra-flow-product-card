<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Hydra Flow Product Card</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="product-card">

    <!-- ================= TOP SECTION ================= -->

    <div class="product-visual">

        <!-- Main Bottle -->
        <div class="main-bottle">
            <img src="bottle1.jpeg" alt="Hydra Flow Bottle">
        </div>


        <!-- Tagline -->
        <div class="tagline">
            <p>
                Carry<br>
                Your Hydration<br>
                Anywhere ♡
            </p>
        </div>


        

    </div>


    <!-- ================= PRODUCT INFORMATION ================= -->

    <div class="product-info">

        <!-- TITLE -->

        <div class="title-row">

            <div>
                <h1>HYDRA FLOW</h1>

                <h2>Bio-Based Hydration Bottle</h2>
            </div>

            <div class="eco-badge">
                🌿 Eco-Friendly
            </div>

        </div>


        <!-- PRICE -->

        <div class="price-section">

            <span class="price">₹799</span>

            <span class="old-price">₹999</span>

            <span class="discount">20% OFF</span>

        </div>


        <!-- FEATURES -->

        <div class="features">

            <div class="feature">
                <div class="feature-icon">🌿</div>
                <span>
                    Bio-Based<br>
                    Material
                </span>
            </div>


            <div class="feature">
                <div class="feature-icon">✓</div>
                <span>
                    Food-Contact<br>
                    Safe
                </span>
            </div>


            <div class="feature">
                <div class="feature-icon">🔒</div>
                <span>
                    Leak-Lock<br>
                    Cap
                </span>
            </div>


            <div class="feature">
                <div class="feature-icon">💧</div>
                <span>
                    Hydration<br>
                    Markings
                </span>
            </div>

        </div>


        <!-- SIZES + COLOURS -->

        <div class="options">

            <div class="sizes">

                <h3>Available Sizes</h3>

                <div class="size-buttons">

                    <button>350 ml</button>

                    <button class="selected">
                        500 ml
                    </button>

                    <button>750 ml</button>

                    <button>1 L</button>

                </div>

            </div>


            <div class="colors">

                <h3>Available Colours</h3>

                <div class="color-buttons">

                    <span class="color green active"></span>

                    <span class="color beige"></span>

                    <span class="color pink"></span>

                    <span class="color blue"></span>

                    <span class="color purple"></span>

                </div>

            </div>

        </div>


        <!-- BOTTOM -->

        <div class="bottom-section">

            <div class="bottom-text">

                <span class="drop">💧</span>

                <p>
                    Small sips.<br>
                    Big energy. ♡
                </p>

            </div>


            <div class="divider"></div>


            <button class="cart-button">

                🛒 Add to Cart

            </button>

        </div>

    </div>

</div>

</body>
</html>
